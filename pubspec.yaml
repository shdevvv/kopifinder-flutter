name: kopifinder
description: "KopiFinder - Cafe Discovery App"
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/new_app_icon.png"
  adaptive_icon_background: "assets/icons/new_app_icon_adaptive_bg.png"
  adaptive_icon_foreground: "assets/icons/new_app_icon_adaptive_fg.png"
