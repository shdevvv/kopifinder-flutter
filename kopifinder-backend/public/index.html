<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KopiFinder API - Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FAF7F0;
      color: #4E342E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 10px 30px rgba(78, 52, 46, 0.08);
      text-align: center;
      border: 1px solid #EFEBE9;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E8F5E9;
      color: #2E7D32;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #2E7D32;
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #4E342E;
      margin-bottom: 8px;
    }
    p {
      color: #795548;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .endpoints {
      text-align: left;
      background: #FAF7F0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .endpoints div {
      font-size: 13px;
      font-family: monospace;
      color: #52634A;
      margin: 6px 0;
    }
    a.btn {
      display: inline-block;
      background: #52634A;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #41503b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Backend Online
    </div>
    <h1>☕ KopiFinder API</h1>
    <p>Backend API server untuk aplikasi KopiFinder Discovery App berjalan normal dan terhubung ke Supabase PostgreSQL.</p>
    <div class="endpoints">
      <div>✓ GET /api/v1/health</div>
      <div>✓ GET /api/v1/cafes</div>
      <div>✓ GET /api/v1/community</div>
      <div>✓ POST /api/v1/auth/register</div>
    </div>
    <a href="/api/v1/health" class="btn">Periksa Status Health</a>
  </div>
</body>
</html>
